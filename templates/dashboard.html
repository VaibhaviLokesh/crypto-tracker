<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - CryptoTracker</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <nav>
        <div class="logo">🪙 CryptoTracker</div>
        <div class="nav-links">
            <a href="{{ url_for('home') }}">Home</a>
            <a href="{{ url_for('dashboard') }}">Portfolio</a>
            <a href="{{ url_for('logout') }}">Logout</a>
        </div>
    </nav>

    <div class="container">
        <div class="welcome-banner">
            <h2>Welcome, {{ username }}! 👋</h2>
            <p>Track your crypto portfolio in real time</p>
        </div>

        <div class="dashboard-grid">
            <div class="card">
                <h3>➕ Add Coin to Portfolio</h3>
                <form method="POST" action="{{ url_for('add_coin') }}">
                    <div class="form-group">
                        <label>Coin Name</label>
                        <input type="text" name="coin_name" placeholder="e.g. Bitcoin" required>
                    </div>
                    <div class="form-group">
                        <label>Coin ID (CoinGecko ID)</label>
                        <input type="text" name="coin_id" placeholder="e.g. bitcoin" required>
                    </div>
                    <div class="form-group">
                        <label>Quantity</label>
                        <input type="number" name="quantity" step="0.0001" placeholder="e.g. 0.5" required>
                    </div>
                    <div class="form-group">
                        <label>Buy Price (USD)</label>
                        <input type="number" name="buy_price" step="0.01" placeholder="e.g. 60000" required>
                    </div>
                    <button type="submit" class="btn-primary">Add to Portfolio</button>
                </form>
            </div>

            <div class="card">
                <h3>📊 My Portfolio</h3>
                <div class="portfolio-summary">
                    <div class="summary-item">
                        <span>Total Value</span>
                        <strong id="total-value">$0.00</strong>
                    </div>
                    <div class="summary-item">
                        <span>Total P/L</span>
                        <strong id="total-pl">$0.00</strong>
                    </div>
                </div>
                <div id="portfolio-table">
                    <table>
                        <thead>
                            <tr>
                                <th>Coin</th>
                                <th>Quantity</th>
                                <th>Buy Price</th>
                                <th>Current Price</th>
                                <th>Profit/Loss</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="portfolio-body">
                            <tr>
                                <td colspan="6">Loading portfolio...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- CHART SECTION -->
        <div class="card chart-card">
            <div class="chart-header">
                <h3>📈 Price History (7 Days)</h3>
                <div class="chart-buttons">
                    <button onclick="loadChart('bitcoin')" class="chart-btn active" id="btn-bitcoin">Bitcoin</button>
                    <button onclick="loadChart('ethereum')" class="chart-btn" id="btn-ethereum">Ethereum</button>
                    <button onclick="loadChart('solana')" class="chart-btn" id="btn-solana">Solana</button>
                    <button onclick="loadChart('ripple')" class="chart-btn" id="btn-ripple">XRP</button>
                </div>
            </div>
            <canvas id="priceChart" height="100"></canvas>
        </div>
    </div>

    <script>
        let chartInstance = null;

        async function loadPortfolio() {
            const response = await fetch("{{ url_for('get_portfolio') }}");
            const data = await response.json();
            const tbody = document.getElementById('portfolio-body');
            const totalEl = document.getElementById('total-value');
            const totalPlEl = document.getElementById('total-pl');

            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6">No coins added yet!</td></tr>';
                totalEl.textContent = '$0.00';
                totalPlEl.textContent = '$0.00';
                return;
            }

            tbody.innerHTML = '';
            let totalValue = 0;
            let totalPL = 0;

            data.forEach(coin => {
                const pl = ((coin.current_price - coin.buy_price) * coin.quantity);
                const currentValue = coin.current_price * coin.quantity;
                totalValue += currentValue;
                totalPL += pl;
                const isProfit = pl >= 0;
                tbody.innerHTML += `
                    <tr>
                        <td>${coin.coin_name}</td>
                        <td>${coin.quantity}</td>
                        <td>$${coin.buy_price.toLocaleString()}</td>
                        <td>$${coin.current_price.toLocaleString()}</td>
                        <td class="${isProfit ? 'positive' : 'negative'}">
                            ${isProfit ? '+' : ''}$${pl.toFixed(2)}
                        </td>
                        <td><a href="/delete_coin/${coin.id}" class="delete-btn" onclick="return confirm('Remove this coin?')">🗑️</a></td>
                    </tr>
                `;
            });

            totalEl.textContent = '$' + totalValue.toFixed(2);
            totalPlEl.className = totalPL >= 0 ? 'positive' : 'negative';
            totalPlEl.textContent = (totalPL >= 0 ? '+' : '') + '$' + totalPL.toFixed(2);
        }

        async function loadChart(coinId) {
            // Update active button
            document.querySelectorAll('.chart-btn').forEach(btn => btn.classList.remove('active'));
            const activeBtn = document.getElementById('btn-' + coinId);
            if (activeBtn) activeBtn.classList.add('active');

            try {
                const response = await fetch(
                    `https://api.coingecko.com/api/v3/coins/${coinId}/market_chart?vs_currency=usd&days=7`
                );
                const data = await response.json();

                const labels = data.prices.map(p => {
                    const date = new Date(p[0]);
                    return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
                });

                const prices = data.prices.map(p => p[1]);
                const isUp = prices[prices.length - 1] >= prices[0];
                const color = isUp ? '#3fb950' : '#f85149';

                if (chartInstance) chartInstance.destroy();

                const ctx = document.getElementById('priceChart').getContext('2d');
                chartInstance = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: labels,
                        datasets: [{
                            label: coinId.charAt(0).toUpperCase() + coinId.slice(1) + ' Price (USD)',
                            data: prices,
                            borderColor: color,
                            backgroundColor: color + '22',
                            borderWidth: 2,
                            pointRadius: 0,
                            fill: true,
                            tension: 0.4
                        }]
                    },
                    options: {
                        responsive: true,
                        plugins: {
                            legend: {
                                labels: { color: '#ffffff' }
                            }
                        },
                        scales: {
                            x: {
                                ticks: { color: '#8b949e', maxTicksLimit: 7 },
                                grid: { color: '#21262d' }
                            },
                            y: {
                                ticks: {
                                    color: '#8b949e',
                                    callback: val => '$' + val.toLocaleString()
                                },
                                grid: { color: '#21262d' }
                            }
                        }
                    }
                });
            } catch (error) {
                console.error('Chart error:', error);
            }
        }

        loadPortfolio();
        loadChart('bitcoin');
        setInterval(loadPortfolio, 30000);
    </script>
</body>
</html>
